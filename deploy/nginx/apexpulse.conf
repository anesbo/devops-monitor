# ApexPulse Observability Platform - Production Nginx Reverse Proxy
# Features: Gzip compression, cache control, API reverse proxy, SSE/WebSocket upgrades, SSL/TLS ready

upstream apexpulse_backend {
    server 127.0.0.1:4000;
    keepalive 32;
}

# Redirect HTTP to HTTPS (uncomment when SSL is enabled)
# server {
#     listen 80;
#     listen [::]:80;
#     server_name pulse.yourdomain.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    listen [::]:80;
    server_name pulse.yourdomain.com localhost;

    # SSL / TLS configuration placeholders
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # ssl_certificate /etc/letsencrypt/live/pulse.yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/pulse.yourdomain.com/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    # ssl_prefer_server_ciphers on;
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_timeout 1d;

    root /var/www/apexpulse/client;
    index index.html;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # Static Assets Caching (Vite hashed bundles in /assets/)
    location ~* \.(?:css|js|woff2?|svg|ttf|eot|ico|png|jpg|jpeg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # API Reverse Proxy & Streaming (SSE / WebSockets)
    location /api/ {
        proxy_pass http://apexpulse_backend;
        proxy_http_version 1.1;

        # Header Upgrades for WebSocket / Server-Sent Events (SSE)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for live telemetry streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Single Page Application (SPA) routing fallback
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }
}

# Map for WebSocket connection upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
