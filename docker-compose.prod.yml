version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: apexpulse-prod-server
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DB_PATH=/data/apexpulse.db
      - SIMULATION_INTERVAL_MS=3000
      - NODE_INGEST_SECRET=${NODE_INGEST_SECRET:-apexpulse-telemetry-secret}
    volumes:
      - apexpulse-prod-data:/data
    networks:
      - apexpulse-net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/api/nodes', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: apexpulse-prod-client
    restart: always
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - apexpulse-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  apexpulse-prod-data:
    driver: local

networks:
  apexpulse-net:
    driver: bridge
